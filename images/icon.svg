<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <circle cx="64" cy="64" r="60" fill="#1E3A5F"/>
  
  <!-- Otter body - elongated like real otter -->
  <ellipse cx="64" cy="85" rx="20" ry="12" fill="#6B4423"/>
  
  <!-- Otter tail -->
  <ellipse cx="90" cy="92" rx="14" ry="5" fill="#5D3A1A" transform="rotate(-20 90 92)"/>
  
  <!-- Otter head - rounder, smaller -->
  <ellipse cx="64" cy="52" rx="22" ry="18" fill="#8B5A2B"/>
  
  <!-- Otter ears - small and round -->
  <circle cx="46" cy="38" r="6" fill="#6B4423"/>
  <circle cx="82" cy="38" r="6" fill="#6B4423"/>
  <circle cx="46" cy="38" r="3" fill="#D2B48C"/>
  <circle cx="82" cy="38" r="3" fill="#D2B48C"/>
  
  <!-- Otter face - white/cream chin area (characteristic) -->
  <ellipse cx="64" cy="58" rx="12" ry="8" fill="#F5DEB3"/>
  
  <!-- Otter nose - small black -->
  <ellipse cx="64" cy="52" rx="4" ry="3" fill="#1a1a1a"/>
  
  <!-- Whiskers -->
  <line x1="50" y1="56" x2="38" y2="54" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="58" x2="36" y2="58" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="38" y2="62" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="56" x2="90" y2="54" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="58" x2="92" y2="58" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="60" x2="90" y2="62" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Otter eyes - small, friendly -->
  <circle cx="54" cy="46" r="4" fill="#1a1a1a"/>
  <circle cx="74" cy="46" r="4" fill="#1a1a1a"/>
  <circle cx="55" cy="45" r="1.5" fill="#fff"/>
  <circle cx="75" cy="45" r="1.5" fill="#fff"/>
  
  <!-- Otter paws -->
  <ellipse cx="50" cy="78" rx="7" ry="5" fill="#8B5A2B"/>
  <ellipse cx="78" cy="78" rx="7" ry="5" fill="#8B5A2B"/>
  
  <!-- Clock held by otter -->
  <circle cx="64" cy="80" r="14" fill="#fff" stroke="#E74C3C" stroke-width="2"/>
  
  <!-- Clock face marks -->
  <circle cx="64" cy="69" r="1.5" fill="#333"/>
  <circle cx="64" cy="91" r="1.5" fill="#333"/>
  <circle cx="53" cy="80" r="1.5" fill="#333"/>
  <circle cx="75" cy="80" r="1.5" fill="#333"/>
  
  <!-- Clock hands -->
  <line x1="64" y1="80" x2="64" y2="71" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="71" y2="83" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Clock center -->
  <circle cx="64" cy="80" r="2" fill="#E74C3C"/>
</svg>
